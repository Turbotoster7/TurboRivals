name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    # Windows like the players: SO_EXCLUSIVEADDRUSE, netsh rule syntax and the hosts file's
    # CRLF all behave the way they do on a real host.
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install the certificate dependency
        run: python -m pip install cryptography

      - name: Run the tests
        run: python -m unittest discover -s tests -v
