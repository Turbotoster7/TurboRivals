name: tests

# The launcher and server tests on Windows (the platform players use - the console tools,
# the job object, SO_EXCLUSIVEADDRUSE) and on Linux; then the installer, built the way a release
# is, installed silently and smoke-tested (tests/smoke_build.py).
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: cryptography - the reference test_stub_cert.py compares the certificate with
        run: python -m pip install cryptography
      - name: Python tests (launcher, hosts switch, live server with a fake game client)
        run: python -m unittest discover -s tests -v
      - name: Interface logic tests
        run: node --test tests/js/core.test.mjs

  windows-build:
    name: windows build + installer
    # A branch of this repository builds on push; a pull request only when it comes from a fork.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build environment (requirements.txt)
        run: |
          python -m venv venv
          venv\Scripts\python.exe -m pip install --disable-pip-version-check -q -r requirements.txt
      - name: Inno Setup and the WebView2 Runtime
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
              choco install innosetup --no-progress -y
          }
          $key = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          if (-not (Test-Path $key)) {
              Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile "$env:RUNNER_TEMP\webview2.exe"
              Start-Process "$env:RUNNER_TEMP\webview2.exe" -ArgumentList '/silent', '/install' -Wait
          }
          $runtime = Get-ItemProperty $key -ErrorAction SilentlyContinue
          "WebView2 Runtime: $(if ($runtime) { $runtime.pv } else { 'not found - the window step will fail on it' })"
      - name: Screen large enough for the window
        continue-on-error: true
        run: Set-DisplayResolution -Width 1920 -Height 1080 -Force
      - name: Build (build.ps1 - PyInstaller, then Inno Setup)
        run: ./build.ps1
      - name: Install, per user and silently
        run: |
          $setup = (Get-Item dist\TurboRivalsSetup-*.exe).FullName
          Start-Process $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait
          $exe = "$env:LOCALAPPDATA\Programs\TurboRivals\TurboRivals.exe"
          if (-not (Test-Path $exe)) { throw "the installer did not put $exe in place" }
          "EXE=$exe" >> $env:GITHUB_ENV
      - name: Smoke test the installed launcher
        run: |
          venv\Scripts\python.exe -m pip install --disable-pip-version-check -q pillow
          venv\Scripts\python.exe tests\smoke_build.py --exe $env:EXE --dist dist --screenshot smoke\launcher.png --json smoke\result.json
      - name: Uninstall
        run: |
          Start-Process "$env:LOCALAPPDATA\Programs\TurboRivals\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait
          for ($i = 0; $i -lt 60 -and (Test-Path $env:EXE); $i++) { Start-Sleep 1 }
          if (Test-Path $env:EXE) { throw "$env:EXE is still there after the uninstaller ran" }
      # The installer and the smoke results are a convenience: the steps above are the checks,
      # and the job summary has the results either way (the artifact storage quota can be full).
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: TurboRivals-windows
          path: |
            dist/TurboRivalsSetup-*.exe
            smoke/
          retention-days: 14
