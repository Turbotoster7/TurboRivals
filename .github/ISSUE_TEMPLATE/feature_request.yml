name: Idea
description: Suggest something the server or the launcher should do
labels: [idea]
body:
  - type: textarea
    id: idea
    attributes:
      label: What should it do
      description: >
        Worth knowing what is already on the roadmap: internet play without a VPN is a known
        gap, not an oversight. Host migration and sessions of up to six players already work.
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why
      description: What you are trying to do that the current version makes hard.
